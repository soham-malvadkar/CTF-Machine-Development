<!DOCTYPE html>
<html>

<head>
    <title>Dashboard - The Agency</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">The Agency Dashboard</div>
        <nav>
            <a href="{{ url_for('dashboard') }}">Home</a>
            <a href="{{ url_for('tools') }}">Connectivity Tools</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h1>Welcome, {{ username }}</h1>
            <p>Access Level: Authenticated Agent</p>
            <p>Confidential information is restricted to Level 5 clearance.</p>
        </div>
    </div>
</body>

</html>
